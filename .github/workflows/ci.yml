name: CI

on:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: blacksmith-6vcpu-macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Install lint tools
        run: |
          brew install mint actionlint
          mint bootstrap
      - name: Lint
        run: make lint

  macos:
    name: macOS
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    runs-on: blacksmith-6vcpu-macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Install dependencies
        run: |
          brew bundle install
          mint bootstrap
      - name: Build
        run: swift build 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Run tests
        run: make test-swift

  ubuntu:
    container: swift:6.3
    name: Linux (Swift 6.3)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Install Mint and xcbeautify
        run: |
          git clone --depth 1 --branch 0.18.0 https://github.com/yonaskolb/Mint.git "$RUNNER_TEMP/Mint"
          swift build --package-path "$RUNNER_TEMP/Mint" -c release
          mint_bin="$(swift build --package-path "$RUNNER_TEMP/Mint" -c release --show-bin-path)"
          echo "$mint_bin" >> "$GITHUB_PATH"
          "$mint_bin/mint" install cpisciotta/xcbeautify
      - name: Build
        run: swift build 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Test
        run: swift test 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
